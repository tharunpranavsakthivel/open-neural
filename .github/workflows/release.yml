name: Release

on:
  push:
    branches:
      - 'release/*'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python linting dependencies
        run: pip install ruff black

      - name: Run Python linter (ruff)
        run: ruff check backend/

      - name: Run Python formatter check (black)
        run: black --check backend/

      - name: Run Frontend linter (eslint)
        run: npx eslint frontend/src/

      - name: Run Frontend formatter check (prettier)
        run: npx prettier --check frontend/src/

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          pip install -e ./backend
          pip install pytest pytest-cov pytest-asyncio aiosqlite

      - name: Run backend tests with coverage
        run: pytest backend/tests/ --cov=openneural_backend --cov-report=xml --cov-fail-under=80

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run frontend tests with coverage
        run: npm run test:coverage -w frontend

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: |
          npm run typecheck --workspaces --if-present

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -w frontend

      - name: Build electron (tsc compilation)
        run: npx tsc -p electron/tsconfig.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            frontend/dist/
            electron/dist/

  package-and-release:
    needs: [lint, test-backend, test-frontend, typecheck, build]
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build all workspaces (compiling assets)
        run: npm run build

      - name: Run electron-builder packager
        run: npm run package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Identify release artifact path (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          echo "ARTIFACT_PATH=electron/dist/*.dmg" >> $GITHUB_ENV

      - name: Identify release artifact path (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "ARTIFACT_PATH=electron/dist/*.exe" >> $GITHUB_ENV

      - name: Identify release artifact path (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo "ARTIFACT_PATH=electron/dist/*.AppImage" >> $GITHUB_ENV

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: true
          files: ${{ env.ARTIFACT_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python linting dependencies
        run: pip install ruff black

      - name: Run Python linter (ruff)
        run: ruff check backend/

      - name: Run Python formatter check (black)
        run: black --check backend/

      - name: Run Frontend linter (eslint)
        run: npx eslint frontend/src/

      - name: Run Frontend formatter check (prettier)
        run: npx prettier --check frontend/src/

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          pip install -e ./backend
          pip install pytest pytest-cov pytest-asyncio aiosqlite

      - name: Run backend tests with coverage
        run: pytest backend/tests/ --cov=openneural_backend --cov-report=xml --cov-fail-under=80

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run frontend tests with coverage
        run: npm run test:coverage -w frontend

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: |
          npm run typecheck --workspaces --if-present

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -w frontend

      - name: Build electron (tsc compilation)
        run: npx tsc -p electron/tsconfig.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            frontend/dist/
            electron/dist/

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openneural-backend"
version = "0.1.0"
description = "FastAPI ML service for the OpenNeural desktop application."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "OpenNeural Team"}
]
keywords = ["ml", "machine-learning", "fastapi", "local"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime dependency pins are mirrored in requirements.txt for reproducible installs.
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite==0.22.1",
    "greenlet==3.5.3",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "optuna>=4.1.0",
    "joblib>=1.3.0",
    "skl2onnx==1.20.0",
    "onnx==1.18.0",
    "onnxconverter-common==1.16.0",
    "reportlab>=4.0.0",
    "bcrypt>=4.0.0",
    "httpx>=0.27.0",
    "python-multipart==0.0.32",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
# CLI entry point for the backend service
openneural-backend = "openneural_backend.__main__:main"

[project.urls]
Homepage = "https://github.com/openneural/openneural"
Repository = "https://github.com/openneural/openneural"
Documentation = "https://github.com/openneural/openneural#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["openneural_backend*"]
exclude = ["test*"]

[tool.setuptools.package-data]
openneural_backend = ["py.typed"]

# Tool configurations
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "N803", "N806", "E402", "B904", "B017", "F841", "SIM105", "C414", "W291", "W293", "F401", "B008", "SIM102", "N802", "B028", "B007", "SIM108", "I001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["test", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["openneural_backend"]
omit = [
    "openneural_backend/__init__.py",
    "openneural_backend/__main__.py",
    "openneural_backend/app.py",
    "openneural_backend/config.py",
    "openneural_backend/db/*",
    "openneural_backend/middleware/*",
    "openneural_backend/models/*",
    "openneural_backend/routers/*",
    "openneural_backend/shutdown.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
